name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub (if needed)
        if: env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      
      - name: Create .env.staging
        run: |
          cat > .env.staging << EOF
          # Database
          DB_USER=saas_staging_user
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME=saas_staging_db
          DB_PORT=5432
          
          # Backend
          NODE_ENV=staging
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          APP_URL=${{ secrets.STAGING_APP_URL }}
          API_URL=${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }}/api
          
          # Frontend
          FRONTEND_PORT=3001
          BACKEND_PORT=3000
          
          # Nginx
          NGINX_HTTP_PORT=80
          NGINX_HTTPS_PORT=443
          
          # Redis
          REDIS_PORT=6379
          
          # Payment providers (optional for staging)
          YUKASSA_SHOP_ID=${{ secrets.YUKASSA_SHOP_ID }}
          YUKASSA_SECRET_KEY=${{ secrets.YUKASSA_SECRET_KEY }}
          CLOUDPAYMENTS_PUBLIC_ID=${{ secrets.CLOUDPAYMENTS_PUBLIC_ID }}
          CLOUDPAYMENTS_API_SECRET=${{ secrets.CLOUDPAYMENTS_API_SECRET }}
          ROBOKASSA_MERCHANT_LOGIN=${{ secrets.ROBOKASSA_MERCHANT_LOGIN }}
          ROBOKASSA_PASSWORD_1=${{ secrets.ROBOKASSA_PASSWORD_1 }}
          ROBOKASSA_PASSWORD_2=${{ secrets.ROBOKASSA_PASSWORD_2 }}
          ROBOKASSA_TEST_MODE=true
          
          # Email (optional for staging)
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=587
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          EOF
      
      - name: Deploy to staging server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DIR }}
            git pull origin staging
            docker-compose -f docker-compose.staging.yml down
            docker-compose -f docker-compose.staging.yml build --no-cache
            docker-compose -f docker-compose.staging.yml up -d
            docker-compose -f docker-compose.staging.yml exec -T backend npx prisma migrate deploy
            docker-compose -f docker-compose.staging.yml exec -T backend npx prisma generate

